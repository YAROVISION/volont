<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Blueprint blue background -->
  <rect width="36" height="36" rx="6" fill="#2c4c82"/>
  
  <!-- Outer orange square border -->
  <rect x="3" y="3" width="30" height="30" rx="2" fill="none" stroke="#ef633e" stroke-width="2"/>
  
  <!-- Rotated dashed white wireframe square -->
  <rect x="8" y="8" width="20" height="20" fill="none" stroke="rgba(255, 255, 255, 0.55)" stroke-width="1.2" stroke-dasharray="2,2" transform="rotate(45 18 18)"/>
  
  <!-- The inner "V" character -->
  <text x="18.5" y="24.5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="19" fill="#ef633e" text-anchor="middle">V</text>
</svg>
