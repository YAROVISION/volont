services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volont-backend
    restart: always
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "8765:8765"
    networks:
      - volont-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: volont-frontend
    restart: always
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.volont.rule=Host(`volont.lexis.blog`)"
      - "traefik.http.routers.volont.entrypoints=web"
      - "traefik.http.routers.volont-secure.rule=Host(`volont.lexis.blog`)"
      - "traefik.http.routers.volont-secure.entrypoints=websecure"
      - "traefik.http.routers.volont-secure.tls=true"
      - "traefik.http.routers.volont-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.volont.loadbalancer.server.port=80"
    networks:
      - volont-net
      - traefik_default

networks:
  volont-net:
    driver: bridge
  traefik_default:
    external: true
